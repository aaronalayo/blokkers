<script>
    function changeSizeRight(){
        if($("#a3").is(':checked')){
            $("#a2").prop("checked", true);
        }
        else if($("#a2").is(':checked')){
            $("#a1").prop("checked", true);
        }
    }
    function changeSizeLeft(){
        if($("#a1").is(':checked')){
            $("#a2").prop("checked", true);
        }
        else if($("#a2").is(':checked')){
            $("#a3").prop("checked", true);
        }
    }

    function addLetter(id){
       var letter = $(id).text();
       $("#name").val($("#name").val() + letter);
       $(id).addClass("circle");
    }
</script>
