


<div>
    <div id="choose-size" class="centered">
        <p>Choose the size</p>
        
        <p>
            <span><i onclick="changeSizeLeft()" class="fa fa-angle-left"></i></span>
            <span class="radiowrapper" id="wrap3">
                <input type="radio" name="size" value ="a3" id="a3">
                <label for="a3">A3</label>
            </span>
            <span class="radiowrapper" id="wrap2">
                    <input type="radio" name="size" value ="a2" id="a2" checked>
                    <label for="a2">A2</label>
            </span>
            
            <span class="radiowrapper" id="wrap1">
                <input type="radio" name="size" value ="a1" id="a1">
                <label for="a1">A1</label>
            </span>
            <span><i onclick="changeSizeRight()" class="fa fa-angle-right"></i></span>
        </p>
        
    </div>

    
    
</div>
