
<style>
 body {
    font-family: "nunitobold";
    font-size: 17px;
    padding: 8px;

  }

  html {
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    scroll-snap-stop: always
  }

  * {
    box-sizing: border-box;

  }
.row {
    padding-top: 10%;
    padding-left: 30%;
    padding-right: 30%;
  display: -ms-flexbox; /* IE10 */
  display: flex;
  -ms-flex-wrap: wrap; /* IE10 */
  flex-wrap: wrap;
  margin: 0 -16px;
}

.col-25 {
  -ms-flex: 25%; /* IE10 */
  flex: 25%;
}

.col-50 {
  -ms-flex: 50%; /* IE10 */
  flex: 50%;
}



.col-25,
.col-50{
  padding: 0 16px;
}

.container {
  background-color: #f2f2f2;
  padding: 5px 10px 15px 10px;
  border: 1px solid lightgrey;
  border-radius: 3px;
}

input[type=text] {
  width: 100%;
  margin-bottom: 20px;
  padding: 12px;
  border: 1px solid #ccc;
  border-radius: 3px;
}

label {
  margin-bottom: 10px;
  display: block;
}

.icon-container {
  margin-bottom: 20px;
  padding: 7px 0;
  font-size: 24px;
}

.btn {
  background-color: #bbbbbb;
  color: white;
  padding: 12px;
  margin: 10px 0;
  border: none;
  width: 50%;
  border-radius: 3px;
  cursor: pointer;
  font-size: 17px;
}

.btn:hover {
  background-color: #d1d1d1;
}

a {
  text-decoration: none;
  width: 100%;
 
}

hr {
  border: 1px solid lightgrey;
}

span.price {
  float: right;
  color: grey;
}

/* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other (also change the direction - make the "cart" column go on top) */
@media (max-width: 800px) {
  .row {
    flex-direction: column-reverse;
  }
  .col-25 {
    margin-bottom: 20px;
  }
}
</style>

<body>
    <div class="row">

            <div class="col-50">
              <div class="container">
                <h1 >Payment Succesful!</h1>
                <h2 >Payment Id:</h2>
                <p id="data"></p>
                <h2>Payment Details:</h2>
                <h3>Payment Type:</h3>
                <p id="paymentType"></p>
                <h3>Expiry Date:</h3>
                <p id="paymentDetailsCard"></p>
                <h3>Card Number:</h3>
                <p id="cardNumber"></p>
                <h2 >Summary:</h2>
                <h3>Reserved Amount:</h3>
                <p id="reservedAmount"></p>

              </div>
            </div>
          </div>

 

</body>

</html>
