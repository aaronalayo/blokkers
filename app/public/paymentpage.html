<style>
  body {
    font-family: "nunitobold";

  }

  ::-webkit-scrollbar {
    -webkit-appearance: none;
    width: 7px;
  }

  ::-webkit-scrollbar-thumb {
    border-radius: 4px;
    background-color: rgba(0, 0, 0, .5);
    box-shadow: 0 0 1px rgba(255, 255, 255, .5);
  }

  html {
    -webkit-overflow-scrolling: touch !important;
    -webkit-overflow-scrolling: auto !important;
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    scroll-snap-stop: always
  }

  * {
    box-sizing: border-box;

  }

  .row {
    display: -ms-flexbox;
    /* IE10 */
    display: flex;
    -ms-flex-wrap: wrap;
    /* IE10 */
    flex-wrap: nowrap;
    /* margin: 0 -16px; */
  }

  .col-25 {
    -ms-flex: 25%;
    /* IE10 */
    flex: 25%;
  }

  .col-50 {
    -ms-flex: 50%;
    /* IE10 */
    flex: 50%;
  }



  .col-25,
  .col-50 {
    padding: 0 16px;
  }
  .center_doc{
    padding-top: 0%;
    padding-left: 20%;
    padding-right: 20%;
  }

  .container {
    /* background-color: #f2f2f2; */
    margin-left: auto;
    margin-right: auto;
    /* padding: 10px 10px 15px 10px; */
    border: 0px solid lightgrey;
    border-radius: 3px;
  }

  input[type=text] {
    width: 100%;
    margin-bottom: 20px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }



  .btn:hover {
    background-color: #d1d1d1;
  }

  a {
    text-decoration: none;
    width: 100%;

  }

  hr {
    border: 1px solid lightgrey;
  }

  span.price {
    float: right;
    color: grey;
  }

  .logo {
    width: 30%;
    margin-left: auto;
    margin-right: auto;


  }

  #logo_img {
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  #paymentsuccesful {
    text-align: center;



  }

  #date {
    float: right;
  }

  #payment {
    padding-top: 5%;
  }

  .order-container {
    width: 100%;
    display: inline-block;
  }

  .order-table {

    margin-left: auto;
    margin-right: auto;
    display: block;
    display: inline-table;


  }

  .order-table img {
    width: 2em;
    border-collapse: collapse;
    display: flex;
  }

  .order-table table {
    border: none;
    display: block;
    border-collapse: collapse;
    border-spacing: 0;

  }

  .order-table table td,
  tr {
    padding: 0;

  }

  .basket-devider {
    /* text-align: left; */
    border: 0.6px solid #c0c0c0;
    /* margin-inline-start: 0%; */
    width: 100%;
  }

  .size-poster {
    display: inline-block;
    vertical-align: middle;
    margin-left: 2%;
    margin-top: 5%;

  }

  .quantity {
    display: inline-block;
    vertical-align: middle;
    margin-right: 2%;
    margin-top: 5%;

  }

  .poster-price {
    /* display: inline-block; */
    vertical-align: middle;
    margin-top: 8%;
    float: right;
  }

  #total-amount-box {
    float: right;
    margin-right: 0%;
    margin-left: auto;
    margin-top: 2%;
    width: 100%;
  }
  #shippingCol{
    color: rgb(97, 97, 97);
    margin-right: 10%;
  }
  #billingCol{
    float: right;
    width: 100%;
    color: rgb(97, 97, 97);
    margin-left: 10%;
  }
  @media only screen and (min-device-width: 320px) and (max-device-width: 767px) and (-webkit-min-device-pixel-ratio: 2) {
    body {
    font-size: 2vw;
  }
  #billingCol{
    float: right;
    margin-left: 0%;
    width: 100%;
    /* text-align: center; */
    color: rgb(97, 97, 97);
  }
  #shippingCol{
  /* text-align: center; */
  color: rgb(97, 97, 97);
  margin-right: 0;
    
  }
  }

</style>

<body onload="getData()"; onLoad="JavaScript:checkRefresh();" onUnload="JavaScript:prepareForRefresh();">
  <div id="payment">
    <div class="row">
      <div class="container">
        <div class="col-75">
          <div class="center_doc">
            <div class="logo">
              <img id="logo_img" src="images/Blokkers_logo.png">
            </div>
            <div class="row">
              <div class="col-25">
                <h1 id="paymentsuccesful">Payment Succesful!</h1>
              </div>
            </div>
            <div class="row">
              <div class="col-25">
                <h1 id="Summary">Summary</h1>
              </div>
            </div>
            <div class="row">
              <div class="col-50">
                <h2 id="date"></h2>
                <h2 id="orderNumber"></h2>
                <div class="order-container">
                </div>
              </div>
            </div>
            <div class="row">
              <div class="col-25">
                <div id="total-amount-box">
                  <!-- <a style="font-size: 30px;">Total amount</a> -->
                  <p><span >Subtotal</span><span style="float: right;"
                      id="subtotal-amount"></span>
                  </p>
                  <p><span style="color: rgb(97, 97, 97);">Shipping(free)</span>
                    <span style="float: right; color:rgb(97, 97, 97);" id="shipping">0 DKK</span>
                  </p>
                  <p><span style="color: rgb(97, 97, 97);">Taxes(incl.)</span>
                    <span style="float: right; color:rgb(97, 97, 97);" id="taxes-amount"></span>
                  </p>
                  <p><span id="discountSpan" style="color: rgb(97, 97, 97);" hidden>Discount</span>
                    <span style="float: right; color:rgb(97, 97, 97);" id="discount" hidden></span>
                  </p>
                  <hr style="color: lightgrey;">
                  <p style="margin-bottom: 12%;"><span style="margin-bottom: 14%;">Total</span>
                    <span style="float: right;" id="total-amount"></span>
                  </p>
                </div>
                <!-- <hr class="basket-devider"> -->
              </div>
              
            </div>

            <div class="row">
              <div id=shippingCol class="col-25">
                <p>Shipping Address :</p>
                <p><span id="shippingname" ></span>
                <p><span id="shippingaddress"></span>
                <p><span id="shippingzip"></span>
                <p><span id="shippingcity"></span>
                <p><span id="shippingcountry"></span>
                <p><span id="shippingemail"></span>
                </p>
              </div>
              <div id="billingCol" class="col-25">
                <p>Billing Address :</p>
                <p><span id="billingname"></span>
                <p><span id="billingaddress" ></span>
                <p><span id="billingzip"></span>
                <p><span id="billingcity"></span>
                <p><span id="billingcountry"></span>
                <p><span id="billingemail"></span>
              </div>
            </div>
          </div>

        </div>
      </div>

    </div>

  </div>




</body>

</html>
