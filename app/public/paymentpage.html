<style>
  body {
    font-family: "nunitobold";
    font-size: 17px;
    padding: 8px;

  }

  html {
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    scroll-snap-stop: always
  }

  * {
    box-sizing: border-box;

  }

  .row {
    padding-top: 0%;
    padding-left: 20%;
    padding-right: 20%;
    display: -ms-flexbox;
    /* IE10 */
    display: flex;
    -ms-flex-wrap: wrap;
    /* IE10 */
    flex-wrap: wrap;
    margin: 0 -16px;
  }

  .col-25 {
    -ms-flex: 25%;
    /* IE10 */
    flex: 25%;
  }

  .col-50 {
    -ms-flex: 50%;
    /* IE10 */
    flex: 50%;
  }



  .col-25,
  .col-50 {
    padding: 0 16px;
  }


  /* .container {
  background-color: #f2f2f2;
  padding: 10px 10px 15px 10px;
  border: 1px solid lightgrey;
  border-radius: 3px;
} */

  input[type=text] {
    width: 100%;
    margin-bottom: 20px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 3px;
  }



  .btn:hover {
    background-color: #d1d1d1;
  }

  a {
    text-decoration: none;
    width: 100%;

  }

  hr {
    border: 1px solid lightgrey;
  }

  span.price {
    float: right;
    color: grey;
  }

  .logo {
    width: 30%;
    margin-left: auto;
    margin-right: auto;


  }

  #logo_img {
    max-width: 100%;
    margin-left: auto;
    margin-right: auto;
  }

  #paymentsuccesful {
    text-align: center;



  }

  #date {
    float: right;
  }

  #payment {
    padding-top: 5%;
  }

  .order-container {
    width: 100%;
    display: inline-block;
  }

  .order-table {

    margin-left: auto;
    margin-right: auto;
    display: block;
    display: inline-table;


  }

  .order-table img {
    width: 1.5em;
    border-collapse: collapse;
    display: flex;
  }

  .order-table table {
    border: none;
    display: block;
    border-collapse: collapse;
    border-spacing: 0;

  }

  .order-table table td,
  tr {
    padding: 0;
    cursor: pointer;
    vertical-align: middle;
  }

  .basket-devider {
    text-align: left;
    border: 0.6px solid #c0c0c0;
    margin-inline-start: 0%;
    width: 100%;
  }

  .size-poster {
    display: inline-block;
    vertical-align: middle;
    margin-left: 2%;
    margin-top: 5%;

  }

  .quantity {
    display: inline-block;
    vertical-align: middle;
    margin-right: 2%;
    margin-top: 5%;

  }

  .poster-price {
    /* display: inline-block; */
    vertical-align: middle;
    margin-top: 5%;
    float: right;
  }

  #total-amount-box {
    float: right;

    width: 260px;
    margin-right: 0%;
    margin-left: auto;
    margin-top: 2%;
  }


  /* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other (also change the direction - make the "cart" column go on top) */
  @media (max-width: 800px) {
    .row {
      flex-direction: column-reverse;
    }

    .col-25 {
      margin-bottom: 20px;
    }
  }
</style>
