    <div id="createposter">

                                            onchange="getSizeDetails(this)">
                                        <label for="a3">A3</label>
                                    </span>
                                    <span class="radiowrapper" id="wrap2">
                                        <input type="radio" name="size" value="a2" id="a2"

                                    </span>

                            </div>
                        </div>

                                        value="DISABLE"
                                        onclick="onPressBackspace(),disable()"></i>
                                </div>
                                <table id='tablealfabet'>
                                    <tr>
                                        <td id="a" onclick="addLetter(this)">A</td>
                                        <td id="b" onclick="addLetter(this)">B</td>
                                        <td id="c" onclick="addLetter(this)">C</td>
                                        <td id="d" onclick="addLetter(this)">D</td>
                                        <td id="e" onclick="addLetter(this)">E</td>
                                    </tr>

                                        <td id="g" onclick="addLetter(this)">G</td>

                                        <td id="i" onclick="addLetter(this)">I</td>
                                        <td id="j" onclick="addLetter(this)">J</td>
                                    </tr>
