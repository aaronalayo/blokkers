    * {

        display: inline-flex;
    }

        color: white;
        padding: 12px;
        margin-left: 0%;
        margin-top: 2%;
        border: none;
        border-radius: 3px;
        cursor: pointer;
        font-size: 17px;

    }

    .btn:hover {
        background-color: #bbbbbb;
    }

    a {
        color: #2196F3;
        text-decoration: none;

    }

    #tableposter {
        margin-left: 0.5%;
        border: none;
        position: absolute;
        display: block;
        border-collapse: collapse;
    }

    #changecolour {
        margin-left: 120%;
        /* position: absolute; */
        margin-top: 50%;
    }

    #posterfooter {
        padding-top: 5%;
        padding-left: 10%;
        font-size: 25px;
        font-family: "nunitoregular";
        position: absolute;

    }

    #posterdiv {
        margin-left: 30%;
    }

    #write_name {
        margin-left: -12%;
        /* font-weight: bold;
        font-size: 120%;
        font-family: "nunitobold";
        width: fit-content;
        position: absolute; */
    }

    #done_button {

        font-size: 1.1em;
        font-family: "nunitoblack";
        text-decoration: none;
        padding: 0.6em 2em;
        border-radius: 8px;
        color: #fff;
        background-color: #c0c0c0;
        border: 0;
        cursor: pointer;
        margin-left: 154%;
        margin-top: 5%;
    }

    /* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other (also change the direction - make the "cart" column go on top) */
    @media (max-width: 800px) {
        .row {
            flex-direction: column-reverse;
        }

        .col-25 {
            margin-bottom: 15px;
        }


    }

    @media only screen and (max-device-width: 1920px) {
        #posterfooter {
            font-size: 18px;
        }

        #changecolour {
            margin-left: 90%;
            /* position: absolute; */
            margin-top: 30%;
        }

        #done_button {
            margin-left: 125.5%;
            margin-top: 5%;
        }
        #write_name {
            font-size: 100%;
}

    }
</style>

<div id="createposter" class="page">
    <div class="row">
        <div class="col-75">
            <div class="container">
                <div class="row">
                    <div class="col-50">
                        <div id="choose-size" class="centered">
                            <p>Choose the size</p>
                            <p>
                                <span><i onclick="changeSizeLeft()" class="fa fa-angle-left"></i></span>
                                <span class="radiowrapper" id="wrap3">
                                    <input type="radio" name="size" value="a3" id="a3">
                                    <label for="a3">A3</label>
                                </span>
                                <span class="radiowrapper" id="wrap2">
                                    <input type="radio" name="size" value="a2" id="a2" checked>
                                    <label for="a2">A2</label>
                                </span>

                                <span class="radiowrapper" id="wrap1">
                                    <input type="radio" name="size" value="a1" id="a1">
                                    <label for="a1">A1</label>
                                </span>
                                <span><i onclick="changeSizeRight()" class="fa fa-angle-right"></i></span>

                            </p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-50">

                    <div id="write_name">
                        <div>
                            <p id="type">Type</p>
                            <p id="something">something</p>
                            
                            <p id="maxletters">(Max. 12 letters)</p>
                            
                            <input id="name" type='text' name='name' size="25"> <i class="fas fa-backspace fa-2x"
                                style="color: rgb(158, 158, 158);" value="DISABLE"
                                onclick="onPressBackspace(),disable()"></i>
                        </div>

                        <table id='tablealfabet'>
                            <tr>
                                <td id="a" onclick="addLetter(this)">A</td>
                                <td id="b" onclick="addLetter(this)">B</td>
                                <td id="c" onclick="addLetter(this)">C</td>
                                <td id="d" onclick="addLetter(this)">D</td>
                                <td id="e" onclick="addLetter(this)">E</td>
                            </tr>
                            <tr>
                                <td id="f" onclick="addLetter(this)">F</td>
                                <td id="g" onclick="addLetter(this)">G</td>
                                <td id="h" onclick="addLetter(this)">H</td>
                                <td id="i" onclick="addLetter(this)">I</td>
                                <td id="j" onclick="addLetter(this)">J</td>
                            </tr>
                            <tr>
                                <td id="k" onclick="addLetter(this)">K</td>
                                <td id="l" onclick="addLetter(this)">L</td>
                                <td id="m" onclick="addLetter(this)">M</td>
                                <td id="n" onclick="addLetter(this)">N</td>
                                <td id="o" onclick="addLetter(this)">O</td>
                            </tr>
                            <tr>
                                <td id="p" onclick="addLetter(this)">P</td>
                                <td id="q" onclick="addLetter(this)">Q</td>
                                <td id="r" onclick="addLetter(this)">R</td>
                                <td id="s" onclick="addLetter(this)">S</td>
                                <td id="t" onclick="addLetter(this)">T</td>
                            </tr>
                            <tr>
                                <td id="u" onclick="addLetter(this)">U</td>
                                <td id="v" onclick="addLetter(this)">V</td>
                                <td id="w" onclick="addLetter(this)">W</td>
                                <td id="x" onclick="addLetter(this)">X</td>
                                <td id="y" onclick="addLetter(this)">Y</td>
                            </tr>
                            <tr>
                                <td id="z" onclick="addLetter(this)">Z</td>
                                <td id="æ" onclick="addLetter(this)">Æ</td>
                                <td id="ø" onclick="addLetter(this)">Ø</td>
                                <td id="å" onclick="addLetter(this)">Å</td>
                                <td id="-" onclick="addLetter(this)">-</td>
                            </tr>
                        </table>
                        <div>
                            <button type="submit" name="next" value="Next" class="mbtn blue" id="next_button"
                                onclick="validateForm()">Next</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row">
                <div class="col-50">
                    <div id='posterdiv'>
                        <form id="imageForm" action="/satisfied" method="GET">
                            <table id='tableposter'>
                            </table>

                            <div class="row">
                                <div class="col-25">
                                    <div id="changecolour">
                                        <table id="colourtable">
                                        </table>

                                    </div>
                                    <div id="done_div">
                                        <button type="submit" id="done_button" onclick="getSrc()" hidden>Done</button>
                                    </div>
                                </div>
                            </div>

                    </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</div>
