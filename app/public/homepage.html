<script>
    let slideIndex = 0;
    showSlides();

    function showSlides() {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        slideIndex++;
        if (slideIndex > slides.length) { slideIndex = 1 }
        slides[slideIndex - 1].style.display = "block";
        setTimeout(showSlides, 2000); // Change image every 2 seconds
    }
    let slideIndexMob = 0;
    showSlidesMob();

    function showSlidesMob() {
        let i;
        let slidesMob = document.getElementsByClassName("mySlides-mobile");
        for (i = 0; i < slidesMob.length; i++) {
            slidesMob[i].style.display = "none";
        }
        slideIndexMob++;
        if (slideIndexMob > slidesMob.length) { slideIndexMob = 1 }
        slidesMob[slideIndexMob - 1].style.display = "block";
        setTimeout(showSlidesMob, 2000); // Change image every 2 seconds
    }

</script>
