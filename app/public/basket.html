<body onload=" displayPosters(),calculateTotal()">
<div class="row">
  <div class="col-75">
    <div class="container">

      <div id="basket-header">
        <p style="margin: auto; margin-left: inherit;">
          <span>An </span>
          <span id="size"></span>
          <span> poster has been added to your basket</span>
        </p>
        <a href="/createposter" class="mbtn button" id="create-button">New Poster</a>
      </div>
      <div class="row">
        <div id="empty-basket" style="display: none;">
          <p>Your basket is empty</p>
          <a href="/createposter" class="mbtn button" id="empty-button">New Poster</a>
        </div>

      </div>
      <div class="row">
        <div class="col-50">
          <div class="basket-items">
           
          </div>
          
        </div>
        <div class="col-25">
          <div id="total-amount-box">
            <!-- <a style="font-size: 30px;">Total amount</a> -->
            <p><span style="font-size: 15px;">Subtotal</span><span style="float: right;" id="subtotal-amount"></span>
            </p>
            <p><span style="font-size: 15px;color: rgb(97, 97, 97);">Taxes(incl.)</span>
              <span style="float: right; color:rgb(97, 97, 97);" id="taxes-amount"></span>
            </p>
            <hr style="color: lightgrey;">
            <p id="discount-row" style="margin-bottom: 8%;" hidden><span style="font-size: 15px;margin-bottom: 10%;" >Discount</span><span
              style="float: right;" id="discount-amount" ></span></p>
            <p style="margin-bottom: 12%;"><span style="font-size: 15px;margin-bottom: 14%;">Total</span><span
                style="float: right;" id="total-amount"></span></p>
                <div>
                  <a href="/checkout" class="mbtn button" id="proceed-button">Checkout</a>
                </div>
            
            <div class="coupon">
              <input type="text" id="discount" placeholder="Enter discount code"><button id="add-button" type="submit" onclick="applyDiscount()">Add</button>  
            </div>
            </div>
           
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
