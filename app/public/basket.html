<div>
    <div id="basket-header">
        <p style="margin-right: auto;">
            <span id="size"></span>
            <span> poster has been added to your basket</span>
        </p>
        <a href="/checkout" class="mbtn button" id="proceed-button">Proceed to checkout</a>
    </div>

    <div class="basket-container">

    </div>
    
</div>
<script>
    var posters = JSON.parse(sessionStorage.posters);
    function increment(id){
        let str = "#" + id.id + "-quantity";
        let a = $(str).text();
        a++;
        if(a > 1){
            $("#" + id.id + "-decrease").prop('disabled', false);
        }
        $(str).text(a);
    }
    function decrement(id){
        let str = "#" + id.id + "-quantity";
        let a = $(str).text();
        if(a == 1){
            $("#" + id.id + "-decrease").prop('disabled', true);
        }else{
            a--;
            console.log(a);
            $(str).text(a);
        }
    }
    function remove(poster){
        console.log(poster);
        posters.forEach(p => {
            if(p.pname === poster.pname){
                const index = posters.indexOf(p);
                if (index > -1) {
                    posters.splice(index, 1);
                    console.log("deleted");
                    console.log(posters);
                    sessionStorage.setItem("posters", JSON.stringify(posters));
                    document.location.reload(true)
                }
            }
        });
        
    }
    posters.forEach(poster => {
        let quantity = 1;
        var name;
        if(!$("#" + poster.pname).length){
            name = poster.pname;
        }
        else{
            name = poster.pname + 1;
            while($("#" + name).length){
                name = name + 1;
            }
        }
        poster.pname = name;
        $(".basket-container").append(`<div id="poster-display-${name}">`);
        // $(`#poster-display-${name}`).append(`<input class="basket-checkbox" type="checkbox" name=${name}>`);
        $(`#poster-display-${name}`).append(`<div class="basket-table" id=${name}>`);
        $(`#${name}`).append(`<table class="basket-table" id="table-${name}">`);
        var k = 0;
        for (var i = 0; i <= 3; i++) {
            $(`#table-${name}`).append(`<tr id=tr-${i + 1}-${name}>`)
            for (var j = k; j <= k + 2; j++) {
                $(`#tr-${i + 1}-${name}`).append(`<td id=${j + 1}-${name}> `);
                $(`#${j + 1}-${name}`).append(`<img src="${poster.paths[j]}">`);
                }
                $(`#table-${name}`).append("</tr>");
                k = k + 3;
        }
        $(`#${name}`).append("</table>");
        $(`#poster-display-${name}`).append(`<div class="size-poster">
            <span>${poster.size}</span><span> poster</span>
        </div>
        <div class="quantity">
            <span>Quantity</span>
            <span><button id="${name}-decrease" onclick="decrement(${name})"><</button></span>
            <span id="${name}-quantity">${quantity}</span>
            <span><button onclick="increment(${name})">></button></span>
        </div>
        <button class="remove-poster-btn" onclick="remove(`+ JSON.stringify(poster).replace(/"/g, '&quot;') +`)">Remove <i class="fa fa-trash-o"></i></button>`);
        $(`#poster-display-${name}`).append(`<hr class="basket-devider">`);
       // $("#name").text(name);
        $("#size").text(poster.size);
        console.log(poster);
