<body onload=" displayCart()">
<div class="row">
  <div class="col-75">
    <div class="container">
      <form>
        <form id='addressform'>
          <h1 id='contactinformation'>Contact Information</h1>
          <div class="row">

            <div class="col-50 ">
              <h3 id="shipping">Shipping Address</h3>
              <label for="email"><i class="fa fa-envelope"></i> Email</label>
              <input type="text" id="email" name="email" placeholder="john@example.com"
                pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required>

              <label for="fname"><i class="fa fa-user"></i> Full Name</label>
              <input type="text" id="fname" name="fullname" placeholder="John M. Doe"
                pattern="([\s!-~À-ÿĀ-ſ]+\s+[\s!-~À-ÿĀ-ſ]+\s*){1,}" required>
              <label for="code"><i class="fa fa-phone"></i> Country Code</label>
              <select name="countryCode" placeholder="code" id="code">
                <option data-countryCode="DK" value="+45" Selected>Denmark (+45)</option>
                <option data-countryCode="SE" value="+46">Sweden (+46)</option>
                <option data-countryCode="NO" value="+47">Norway (+47)</option>
                <option data-countryCode="GB" value="+44">UK (+44)</option>
              </select>
              <label for="phone"><i class="fa fa-phone"></i> Phone number</label>
              <input type="text" id="phone" name="phone" placeholder="12345678"
                pattern="[0-9]{2}[0-9]{2}[0-9]{2}[0-9]{2}" required />
              <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
              <input type="text" id="address" name="address" placeholder="Hovedgade 26 st th"
                pattern="^([A-zæøåÆØÅ]{2,40}\.?\s)+([0-9]){1,5}\w?(\s.*)?$" required>
              <label for="city"><i class="fa fa-institution"></i> City</label>
              <input type="text" id="city" name="city" placeholder="Copenhagen"
                pattern="^[a-zA-Z\u0080-\u024F]+(?:. |-| |')*([1-9a-zA-Z\u0080-\u024F]+(?:. |-| |'))*[a-zA-Z\u0080-\u024F]*$"
                required>
              <label for="zip">Zip Code</label>
              <input type="text" id="zip" name="zip" placeholder="2500" pattern="\d{4}" required>
            </div>

            <div id="invoiceform" class="col-50 " hidden>
              <h3>Invoice Address</h3>
              <label for="fname"><i class="fa fa-user"></i> Full Name</label>
              <input type="text" id="invoicefullname" name="invoicefullname" placeholder="John M. Doe"
                pattern="([\s!-~À-ÿĀ-ſ]+\s+[\s!-~À-ÿĀ-ſ]+\s*){1,}">
              <label for="code"><i class="fa fa-phone"></i> Country Code</label>
              <select name="countryCode" placeholder="code" id="code">
                <option data-countryCode="DK" value="+45" Selected>Denmark (+45)</option>
                <option data-countryCode="SE" value="+46">Sweden (+46)</option>
                <option data-countryCode="NO" value="+47">Norway (+47)</option>
                <option data-countryCode="GB" value="+44">UK (+44)</option>
              </select>
              <label for="phone"><i class="fa fa-phone"></i> Phone number</label>
              <input type="text" id="invoicephone" name="invoicephone" placeholder="12345678"
                pattern="[0-9]{2}[0-9]{2}[0-9]{2}[0-9]{2}" />
              <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
              <input type="text" id="invoiceaddress" name="invoiceaddress" placeholder="Hovedgade 26 st th"
                pattern="^([A-zæøåÆØÅ]{2,40}\.?\s)+([0-9]){1,5}\w?(\s.*)?$">
              <label for="city"><i class="fa fa-institution"></i> City</label>
              <input type="text" id="invoicecity" name="invoicecity" placeholder="Copenhagen"
                pattern="^[a-zA-Z\u0080-\u024F]+(?:. |-| |')*([1-9a-zA-Z\u0080-\u024F]+(?:. |-| |'))*[a-zA-Z\u0080-\u024F]*$">
              <label for="zip">Zip Code</label>
              <input type="text" id="invoicezip" name="invoicezip" placeholder="2500" pattern="\d{4}">
            </div>
          </div>
          <div class="row">
            <div class="col-50 ">
              <label id="sameaddress">
                <input class="check" type="checkbox" checked="checked" name="sameaddress"
                  onclick="displayForm()">Shipping address same as billing</label>
              <label id="newsletter">
                <input type="checkbox" class="checknews" name="newsletter" onclick="newsLetter()" value="">Receive the
                newsletter</label>
            </div>
          </div>
          <div class="row">
            <div class="col-50 ">
              <h4>Cart
                <span class="price" style="color:black">
                  <i class="fa fa-shopping-cart"></i>
                  <b id="totalItems"></b>
                </span>
              </h4>
              <div class="basket-container">
              </div>
              <div id="shippingprice">
              </div>
              <div id="taxes">
              </div>
              <div id="totalbasket">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-25 ">
              <div id="submit">
                <span><input type="button" id="CreatePayment" value="Go to payment" id="submit" class="btn"
                    onclick="getInfo()"></span>

              </div>
              <div class="basket">
                <span><a id="basket-btn" href="/basket" class="btn">Basket</a></span>
              </div>
            </div>
          </div>



        </form>


    </div>
  </div>
</div>
</body>
</html>
