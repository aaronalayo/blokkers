<div class="row">

          <div class="col-50">

            <label for="fname"><i class="fa fa-user"></i> Full Name</label>
            <input type="text" id="fname" name="fullname" placeholder="John M. Doe"

            <label for="phone"><i class="fa fa-phone"></i> Phone number</label>
            <input type="text" id="phone" name="phone" placeholder="+4512345678"
              pattern="[+]45[0-9]{2}[0-9]{2}[0-9]{2}[0-9]{2}" required />
            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
            <input type="text" id="address" name="address" placeholder="Hovedgade 26 st th"

            <label for="phone"><i class="fa fa-phone"></i> Phone number</label>

            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>

<script>
  let posters = JSON.parse(sessionStorage.posters);
 
  for (let i = 0; i < posters.length; i++) {
 
   
    $(".basket-container").append(
      `<div id="poster-display-${posters[i].pname}">
      <span id=${posters[i].pname}>${posters[i].pname}</span> 
      <span class="size">${posters[i].size}</span><span class="poster"> poster</span>

      <span class="x">x</span> <span id="amount" class="quantity">${posters[i].quantity}</span><span id='itemprice' class="price ${posters[i].size}-price">${findPrice(posters[i].size)}</span>
      <hr >
      
      </div>
     
      `);
    
    let contents = {}, text;
    $(`#poster-display-${posters[i].pname} span`).each(function () {

      text = $(this).text();
      if (!(text in contents)) {
        contents[text] = true;
      }
      else {
        $(this.parentNode).remove();
      }

    });
    
  };

  $('#totalbasket').append(`<p>Total<span id="totalprice" class="price" style="color:black"><b>${setTotal()}</b></span></p>`)
  
  
  function countInPosters() {
    let count = 0;
    let totalItems = 0;
    for (let i = 0; i < posters.length; i++) {
        count = posters[i].quantity;
        totalItems+= count
    console.log(totalItems)

    }
  
  return totalItems
  };
  $("#totalItems").text(countInPosters())
  // let totalItems  = countInPosters();


  function displayForm() {
    $("#invoiceform").hide().prop('required', true)
    if ($('.check').is(":checked")) {
      $("#invoiceform").hide(300);
    } else {
      $("#invoiceform").show(300);
    }
  };

  function newsLetter() {
    $('.checknews').click(function () {
      $('.checknews').attr("checked", "checked");

    })
    $('.checknews').click(function () {
      $('.checknews').removeAttr("checked");

    });
  };
  
  function getFormats() {
    const fetchJson = async url => {
      const response = await fetch(url)
      return response.json()
    }
    return new Promise(function (resolve) {
      const formats = fetchJson('/formats');
      setTimeout(function () {
        resolve(formats)
      }, 200);
    });
  }




  async function findPrice(size) {
    let price;

    await getFormats().then(data => {
      for (let [key] of Object.entries(data.formats)) {
        if (size === data.formats[key].format_no) {
          price = data.formats[key].price 
          $(`.${size}-price`).text(price)
        }
      }

      return price
    })     
  };
  async function setTotal(){
    let total= 0;
    let subTotal;
    // let quantity = countInPosters(pname)
    await getFormats().then(data => {
      for (let [key] of Object.entries(data.formats)) {
        posters.forEach(poster => {
          if (poster.size === data.formats[key].format_no) {
              console.log(data.formats[key].price )
              console.log(poster.quantity )
            subTotal = parseInt(data.formats[key].price) * poster.quantity 
            console.log(subTotal)
            total += subTotal
            console.log(total)
            $("#totalprice").text(total)
        }
    
        });
     
      
      }
      
    

      return total
    })     
   
    }
   

  function getInfo(){
    // let amount;
    // for (let i = 0; i < posters.length; i++) {
    //   amount = countInPosters(posters[i].pname);
    //   Object.assign(posters[i], {amount: amount});
      
    // };
    let quantity = posters.map(poster => poster.quantity);
    let name = posters.map(poster => poster.pname)
    posters = posters.filter(({ pname }, index) => !name.includes(pname, index + 1))


    let fullname = $('#fname').val();
    let email = $('#email').val();
    let phone = $('#phone').val();
    let address = $('#address').val();
    let city = $('#city').val();
    let zip = $('#zip').val();
    let invoicefullname = $('#invoicefullname').val();
    let invoicephone = $('#invoicephone').val();
    let invoiceaddress = $('#invoiceaddress').val();
    let invoicecity = $('#invoicecity').val();
    let invoicezip = $('#invoicezip').val();
    let newsletter = $('.checknews')[0].checked;




    $.ajax({

      type: 'POST',
      url: '/createorder',
      data: {
        'posters': posters,
        'fullname': fullname,
        'email': email,
        'phone': phone,
        'address': address,
        'city': city,
        'zip': zip,
        'invoicefullname': invoicefullname,
        'invoicephone': invoicephone,
        'invoiceaddress': invoiceaddress,
        'invoicecity': invoicecity,
        'invoicezip': invoicezip,
        'newsletter': newsletter
      },
      ContentType: 'application/json',
      dataType: "json",
    }).done(function (data) {

      console.log('success', data);

    }).fail(function (jqXHR, textStatus, errorThrown) {
      var contentType = jqXHR.getResponseHeader("Content-Type");
      if (jqXHR.status === 200 && contentType.toLowerCase().indexOf("text/html") >= 0) {
        window.location.href = "/payment";
        console.log('FAILED! ERROR: ' + errorThrown);

      }
    });

  };

</script>
