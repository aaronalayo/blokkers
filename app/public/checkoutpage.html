<style>
  body {
    font-family: "nunitobold";
    font-size: 17px;
    padding: 8px;

  }

  html {
    scroll-snap-type: y mandatory;
    overflow-y: scroll;
    scroll-snap-stop: always
  }

  * {
    box-sizing: border-box;

  }

  .row {

    padding-left: 10%;
    padding-right: 10%;
    display: -ms-flexbox;
    /* IE10 */
    display: flex;
    -ms-flex-wrap: wrap;
    /* IE10 */
    flex-wrap: wrap;
    margin: 0 100px;

  }

  .col-25 {
    -ms-flex: 35%;
    /* IE10 */
    flex: 35%;

  }

  .col-50 {
    -ms-flex: 50%;
    /* IE10 */
    flex: 50%;
  }

  .col-75 {
    -ms-flex: 75%;
    /* IE10 */
    flex: 75%;
  }

  .col-25,
  .col-50,
  .col-75 {
    padding: 5px 16px;
  }

  .container {
    background-color: transparent;
    padding: 10px 10px 15px 10px;
    border: 1px solid rgb(255, 252, 252);
    border-radius: 3px;

  }

  input[type=text] {
    background-color: #bbbbbb;
    width: 100%;
    margin-bottom: 20px;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 3px;

  }

  label {
    margin-bottom: 10px;
    display: block;
  }

  .icon-container {
    margin-bottom: 20px;
    padding: 7px 0;
    font-size: 24px;
  }

  .btn {
    background-color: #c2c2c2;
    color: white;
    padding: 12px;
    margin-left: 0%;
    margin-top: 2%;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    font-size: 17px;

  }

  .btn:hover {
    background-color: #bbbbbb;
  }

  a {
    color: #2196F3;
    text-decoration: none;
  }

  hr {
    width: auto;
    border: 1px solid lightgrey;
  }

  #sameaddress {
    padding-left: 18%;

  }

  #newsletter {
    padding-left: 18%;
  }

  span.price {
    float: right;
    color: grey;
    width: auto;
  }

  .basket-container {
    width: 100%;
    /* position: absolute; */
  }

  #totalbasket {
    margin-top: 4%;
  }

  .quantity{
  display: inline-block;
  vertical-align: unset;
  margin-left: 2%;
  padding-left: 2%;
}
.poster{
  margin-right: 2%;
  margin-left: 2%;
  display: inline-block;
}
.x{
  margin-right: 2%;
  margin-left: 2%;
}
  /* Responsive layout - when the screen is less than 800px wide, make the two columns stack on top of each other instead of next to each other (also change the direction - make the "cart" column go on top) */
  @media (max-width: 800px) {
    .row {
      flex-direction: column-reverse;
    }

    .col-25 {
      margin-bottom: 15px;
    }
  }

  @media only screen and (min-device-width: 2160px) {
    .basket-container {

      width: 46.5%;

    }

    #totalbasket {
      margin-top: 6%;
    }
  }

  @media only screen and (min-device-width: 1920px) {
    .basket-container {

      width: 40.5%;

    }
  }
</style>

<form>
<div class="row">
  <div class="col-75">
    <div class="container">
      <form id='addresssform'>
        <div class="row">
          <h1 class="centered">Checkout</h1>
          <div class="col-50 ">
            <h3>Delivery Address</h3>
            <label for="email"><i class="fa fa-envelope"></i> Email</label>
            <input type="text" id="email" name="email" placeholder="john@example.com"
              pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required>

            <label for="fname"><i class="fa fa-user"></i> Full Name</label>
            <input type="text" id="fname" name="fullname" placeholder="John M. Doe"
              pattern="([\s!-~À-ÿĀ-ſ]+\s+[\s!-~À-ÿĀ-ſ]+\s*){1,}" required>

            <label for="phone"><i class="fa fa-phone"></i> Phone number</label>
            <input type="text" id="phone" name="phone" placeholder="+4512345678"
              pattern="[+]45[0-9]{2}[0-9]{2}[0-9]{2}[0-9]{2}" required />
            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
            <input type="text" id="address" name="address" placeholder="Hovedgade 26 st th"
              pattern="^([A-zæøåÆØÅ]{2,40}\.?\s)+([0-9]){1,5}\w?(\s.*)?$" required>
            <label for="city"><i class="fa fa-institution"></i> City</label>
            <input type="text" id="city" name="city" placeholder="Copenhagen"
              pattern="^[a-zA-Z\u0080-\u024F]+(?:. |-| |')*([1-9a-zA-Z\u0080-\u024F]+(?:. |-| |'))*[a-zA-Z\u0080-\u024F]*$"
              required>
            <label for="zip">Zip</label>
            <input type="text" id="zip" name="zip" placeholder="2500" pattern="\d{4}" required>
          </div>

          <div id="invoiceform" class="col-50 " hidden>
            <h3>Invoice Address</h3>
            <label for="fname"><i class="fa fa-user"></i> Full Name</label>
            <input type="text" id="invoicefullname" name="invoicefullname" placeholder="John M. Doe"
              pattern="([\s!-~À-ÿĀ-ſ]+\s+[\s!-~À-ÿĀ-ſ]+\s*){1,}">
            <label for="phone"><i class="fa fa-phone"></i> Phone number</label>
            <input type="text" id="invoicephone" name="invoicephone" placeholder="+4512345678"
              pattern="[+]45[0-9]{2}[0-9]{2}[0-9]{2}[0-9]{2}"/>
            <label for="adr"><i class="fa fa-address-card-o"></i> Address</label>
            <input type="text" id="invoiceaddress" name="invoiceaddress" placeholder="Hovedgade 26 st th"
              pattern="^([A-zæøåÆØÅ]{2,40}\.?\s)+([0-9]){1,5}\w?(\s.*)?$">
            <label for="city"><i class="fa fa-institution"></i> City</label>
            <input type="text" id="invoicecity" name="invoicecity" placeholder="Copenhagen"
              pattern="^[a-zA-Z\u0080-\u024F]+(?:. |-| |')*([1-9a-zA-Z\u0080-\u024F]+(?:. |-| |'))*[a-zA-Z\u0080-\u024F]*$">
            <label for="zip">Zip</label>
            <input type="text" id="invoicezip" name="invoicezip" placeholder="2500" pattern="\d{4}">
          </div>
          </div>
          <label id="sameaddress">
            <input class="check" type="checkbox" checked="checked" name="sameaddress" onclick="displayForm()">Shipping
            address
            same as billing</label>
          <label id="newsletter">
            <input type="checkbox" class="checknews" name="newsletter" onclick="newsLetter()" value=""> Receive
            newsletter
          </label>
          <div class="row">
            <div class="col-50 ">
          <h4>Cart
            <span class="price" style="color:black">
              <i class="fa fa-shopping-cart"></i>
              <b id="totalItems"></b>
            </span>
          </h4>
          <div class="basket-container">
          </div>

          <div id="totalbasket">
          </div>

          <div id="submit">
            <button type="submit" id="submit" class="btn" onclick="getInfo(),onDataSubmitted()">Go to payment</button>
          </div>
            </div>
          </div>


      </form>


    </div>
  </div>
</div>
