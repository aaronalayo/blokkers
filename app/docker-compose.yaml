version: "3"
services:
  # prod Image
  blokkers:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: blokkers:local
    ports:
      - "80:8080" # Remember, this must correspond to the environmental variable file.
    container_name: blokkers
    volumes: # Only mounted if run by docker-compose up
      - ./app/src:/app/src
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "1m"
# ./docker/prod_image/Dockerfile